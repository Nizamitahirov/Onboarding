<!doctype html>
<html lang="az" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Onboarding</title>
  <meta name="description" content="Onboarding Management Platform — pre-boarding-dən 180-ci günə qədər.">
  <meta name="theme-color" content="#E4202E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E4202E'/%3E%3Cstop offset='1' stop-color='%23FF7A1F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' fill='white' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
  <script>
    // Tema ilk boyamadan əvvəl tətbiq olunur (yanıb-sönmə olmasın)
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('lang') === 'en') document.documentElement.setAttribute('lang', 'en');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <div id="boot" class="boot">
      <div class="boot-logo">Onboarding</div>
      <div class="boot-spinner" aria-label="Yüklənir…"></div>
      <noscript>Bu tətbiq üçün JavaScript tələb olunur.</noscript>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
